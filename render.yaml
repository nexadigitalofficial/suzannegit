services:
  - type: web
    name: suzannegit
    runtime: python
    plan: pro
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn render_start:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: SECRET_KEY
        sync: false